<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#27272b">
  <title>析言 — 商品评价工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳转到评论工作台</a>
  <header class="header"><a class="brand" href="./" aria-label="析言首页"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h8M3 10v4m18-4v4"/><rect x="5" y="7" width="3" height="10" rx="1"/><rect x="16" y="7" width="3" height="10" rx="1"/></svg></span><span>析言</span></a><button class="button button-primary button-small" data-action="import"><span aria-hidden="true">＋</span> 导入评价</button></header>
  <main id="workspace" tabindex="-1">
    <section class="workspace" aria-label="评价工作台">
      <div class="batch-heading"><div><div class="eyebrow muted">当前批次 <span class="slash">/</span> <span id="batch-type">交互演示</span></div><h1 id="batch-title">蛋白粉 · 差评示例</h1></div><div class="batch-actions"><span class="save-state" id="save-state"><span class="live-dot"></span> 修改保留在本机</span><button class="button button-outline" id="export-button">导出结果 <span aria-hidden="true">↗</span></button></div></div>
      <div class="review-entry"><label class="status-filter">切换批次 <select id="task-history" aria-label="查询历史批次"><option value="">选择已保存批次</option></select></label><button class="text-button" id="manage-history">管理批次</button></div>
      <div class="overview-caption"><h2>体验概览</h2><span>按提及评价计数，同条评价可关联多项体验</span></div><div class="metrics" id="metrics" aria-label="商品体验四维概览"></div>
      <div class="review-area"><div class="list-toolbar"><div class="section-label"><h2>评论明细</h2><span class="count-pill" id="total-count">8</span></div><div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input type="search" id="search" name="search" autocomplete="off" placeholder="搜索评论、处理要点…" aria-label="搜索评论原文"></div></div>
      <div class="filters review-filter-panel"><div class="filter-row"><span class="filter-label">评论类型</span><div class="filter-group" id="comment-type-filters" role="group" aria-label="筛选评论类型"></div></div><div class="filter-row" id="dimension-filter-row" hidden><span class="filter-label">体验细分</span><div class="filter-group" id="dimension-filters" role="group" aria-label="筛选体验细分"></div></div><label class="sr-only" aria-hidden="true">状态 <select id="status-filter" aria-label="筛选复核状态"><option value="all">全部状态</option><option value="organized">已整理</option><option value="unreviewed">待复核</option><option value="reviewed">已人工复核</option></select></label></div>
      <div class="filter-group review-shortcuts" id="review-shortcuts" role="group" aria-label="复核情况查询"></div>
      <div class="table-wrap"><table><thead><tr><th class="id-col">序号</th><th>评论原文</th><th class="tag-col">评价分类 / 细分</th><th class="state-col">复核状态</th><th class="action-col"><span class="sr-only">操作</span></th></tr></thead><tbody id="review-list"></tbody></table></div>
      <div class="list-footer"><span id="list-summary"></span><nav id="pagination" class="pagination" aria-label="评论翻页"></nav></div></div>
    </section>
  </main><footer class="footer"><span>保留原文，让反馈有据可查</span></footer>
  <dialog id="import-dialog" class="modal"><form method="dialog" class="dialog-header"><div><h2>导入一批评价</h2></div><button class="icon-button" aria-label="关闭导入窗口">×</button></form><div class="dialog-body"><label class="field-label" for="batch-name">批次名称</label><input id="batch-name" name="batch_name" autocomplete="off" class="input" placeholder="例如：乳清蛋白 · 十月评价…"><label class="upload-zone" id="upload-zone" for="csv-file"><span class="upload-icon" aria-hidden="true">↥</span><strong id="file-label">选择 CSV 文件，或拖到这里</strong><span>每行一条评论，保留原文与来源；初评、追评放在同一行</span><input id="csv-file" type="file" accept=".csv,text/csv" class="sr-only"></label><div class="import-note">请先整理好需要分析的评价。系统不会按星级自动筛选；预览不开始分析。</div><p class="inline-error" id="import-error" role="alert"></p><div id="import-preview" hidden></div><div class="dialog-actions"><button class="text-button" id="download-template">下载 CSV 模板 ↗</button><button class="button button-primary" id="confirm-import" disabled>导入并预览 <span aria-hidden="true">→</span></button></div></div></dialog>
  <dialog id="review-dialog" class="review-dialog"><form method="dialog" class="review-dialog-header"><div><span class="eyebrow muted" id="detail-id"></span><h2>评价处理</h2></div><button class="icon-button" aria-label="关闭评价详情">×</button></form><div id="detail-content"></div></dialog>
  <dialog id="replace-dialog" class="modal"><form method="dialog" class="dialog-header"><div><div class="eyebrow muted">切换批次</div><h2>切换到其他批次？</h2></div><button class="icon-button" aria-label="取消切换">×</button></form><div class="dialog-body"><p class="muted">切换将离开当前工作台。已保存的结果可从历史批次重新打开。</p><div class="dialog-actions"><button class="text-button" id="cancel-replace">留在当前批次</button><button class="button button-primary" id="accept-replace">确认切换 →</button></div></div></dialog>
  <dialog id="history-dialog" class="history-dialog modal"><form method="dialog" class="dialog-header"><h2>管理历史批次</h2><button class="icon-button" aria-label="关闭批次管理">×</button></form><div class="dialog-body"><div class="filter-group"><button class="filter-button active" id="history-active">历史批次</button><button class="filter-button" id="history-trash">回收站</button></div><p class="muted history-description">移入回收站后可恢复，原文、结果和复核记录均保留。</p><p id="history-error" class="inline-error" role="alert"></p><div id="history-items"></div></div></dialog>
  <dialog id="delete-task-dialog" class="modal"><form method="dialog" class="dialog-header"><h2>移至回收站？</h2><button class="icon-button" aria-label="取消删除批次">×</button></form><div class="dialog-body"><p id="delete-task-name"></p><p class="muted">批次将从历史列表移除，可在回收站恢复。</p><div class="dialog-actions"><button class="text-button" id="cancel-task-delete">取消</button><button class="button button-primary" id="confirm-task-delete">确认移入回收站</button></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="live.js"></script>
</body></html>
